# SPDX-License-Identifier: MPL-2.0
name: Idris 2

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: idris2 --version

      - name: Build library
        run: idris2 --build phi-lam.ipkg

      - name: Build and run tests
        run: |
          idris2 --source-dir src -o phi-lam-tests src/TestNormalize.idr
          ./build/exec/phi-lam-tests

  lean:
    name: Lean 4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Lean toolchain
        env:
          LEAN_SHA256: 5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            -o "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst
          echo "$LEAN_SHA256  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.32.2-linux/bin" >> "$GITHUB_PATH"

      - name: Build with warnings forbidden
        working-directory: formal/lean
        run: lake build --wfail

      - name: Independently check compiled environment
        working-directory: formal/lean
        run: lake env leanchecker PhiLamFormal
